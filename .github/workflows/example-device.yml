# Fork only (branch example-device-test): build the example APK and run its
# integration test on an Android emulator, where flutter_tex_js renders.
name: Example on Android
on:
  push:
    branches: [example-device-test]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Regenerate the Android project
        # example/android predates the declarative Gradle plugins block.
        working-directory: example
        run: |
          rm -rf android
          flutter create --platforms android --project-name example .
          flutter pub get
      - name: Build the APK
        working-directory: example
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: example-apk
          path: example/build/app/outputs/flutter-apk/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: example
          script: flutter drive --driver test_driver/integration_test.dart --target integration_test/latex_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: example/screenshots/
